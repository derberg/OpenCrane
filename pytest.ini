[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Note: By default, skip integration tests that require milvus-lite
# To run them: pytest -m integration (in Docker) or install pymilvus[milvus_lite]
# To run all tests: pytest -m ""
addopts = --cov=opencrane --cov-report=term-missing --cov-fail-under=100 -m "not integration"
markers =
    integration: marks tests as integration tests requiring milvus-lite (run in Docker or install pymilvus[milvus_lite])
    unit: marks tests as unit tests (fast, mocked)