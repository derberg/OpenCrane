[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# A bare `pytest` run skips integration tests, which require milvus-lite.
# To run all tests: pytest -m "" (./pytest.sh does this by default)
# Coverage is not enforced here; use ./pytest.sh --check-coverage for the 100% gate.
addopts = -m "not integration"
markers =
    integration: marks tests as integration tests requiring milvus-lite (run in Docker or install pymilvus[milvus_lite])
    unit: marks tests as unit tests (fast, mocked)
