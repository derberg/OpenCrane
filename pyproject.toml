[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrane"
version = "0.1.0"
description = "A standalone, extensible RAG/MCP library for building AI-powered documentation search."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "derberg" }]
requires-python = ">=3.11"
dependencies = [
    # Shared dependencies
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "einops>=0.7.0",
    # MCP Server dependencies
    "mcp>=0.1",
    "uvicorn>=0.24.0",
    "starlette>=0.32.0",
    "rank-bm25>=0.2.2",
    # ML dependencies (embeddings and vector DB)
    "sentence-transformers>=2.0",
    "pymilvus[milvus_lite]>=2.5,<2.6",
    # RAG pipeline dependencies
    "PyGithub>=1.57",
    "requests>=2.31",
    "tiktoken>=0.5.0",
    "docling>=0.1.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
]

[project.scripts]
opencrane = "opencrane.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencrane*"]
