name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual fallback. A release created by release-please with the default
  # GITHUB_TOKEN cannot start this workflow (GitHub blocks that cascade), so this
  # button publishes such a release without needing a PAT. Give it the tag to
  # build, so a manual run publishes that exact release rather than whatever
  # happens to be on main.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.30.4)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # On a release event this is already the tag; on a manual run it is the
        # tag typed into the input.
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Build package
      run: pip install build && python -m build

    # Tag name from the GitHub release is used as-is.
    # Make sure the release tag matches the version in pyproject.toml
    # (e.g. create a release tagged "v0.1.0" for version = "0.1.0").
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
